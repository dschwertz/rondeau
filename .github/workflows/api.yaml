name: api
on:
  push:
    branches:
      - main
      - dev
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout
jobs:
  deploy-api:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          audience: sts.amazonaws.com
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}

      - name: Setup S3 bucket
        run: |
          aws cloudformation deploy \
          --stack-name api-s3 \
          --template-file ./cloudformation/api/s3/s3.yaml \
          --parameter-overrides \
            LambdaSourceBucketName=${{ vars.ENVIRONMENT }}-yeschef-lambda-source-0001

      - name: Create IAM roles
        run: |
          aws cloudformation deploy \
          --stack-name api-iam \
          --capabilities CAPABILITY_NAMED_IAM \
          --template-file ./cloudformation/api/iam/iam.yaml

      - name: Build and upload Lambda zip files
        env:
          Environment: ${{ vars.ENVIRONMENT }}
        run: |
          chmod +x ./cloudformation/api/lambda/lambdaUpload.sh
          ./cloudformation/api/lambda/lambdaUpload.sh

      - name: Create Lambdas
        run: |
          aws cloudformation deploy \
          --stack-name api-lambda \
          --template-file ./cloudformation/api/lambda/lambda.yaml \
          --parameter-overrides \
            LambdaRole=${{ vars.API_LAMBDA_ROLE }} \
            LambdaSourceBucketName=${{ vars.ENVIRONMENT }}-yeschef-lambda-source-0001
