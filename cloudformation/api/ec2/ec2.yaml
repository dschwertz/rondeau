AWSTemplateFormatVersion: 2010-09-09
Description: EC2 service

Parameters:
  ApiCertificateArn:
    Type: String
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  Vpc01:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 192.168.0.0/24
      EnableDnsHostnames: true

  PrivateSubnet01:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 192.168.0.0/27
      AvailabilityZone: !Select [0, !GetAZs '']
      VpcId: !Ref Vpc01

  PrivateSubnet02:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 192.168.0.32/27
      AvailabilityZone: !Select [1, !GetAZs '']
      VpcId: !Ref Vpc01

  InternetGateway01:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: CloudFront Required

  Ig01Vpc01:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway01
      VpcId: !Ref Vpc01

  Sg01:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc01
      GroupDescription: ALB SG

  Sg01InboundRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allows traffic from CloudFront
      GroupId: !Ref Sg01
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourcePrefixListId: pl-82a045eb

  Alb01:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      SecurityGroups:
        - !Ref Sg01
      Subnets:
        - !Ref PrivateSubnet01
        - !Ref PrivateSubnet02

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb01
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ApiCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  Sg02:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc01
      GroupDescription: App instance SG

  Sg02InboundRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allows traffic from ALB
      GroupId: !Ref Sg02
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref Sg01

  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.nano
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PrivateSubnet01
      SecurityGroupIds:
        - !Ref Sg02
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          cat << 'EOF' > /srv/echo_server.py
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.end_headers()
                  self.wfile.write(f"You requested: {self.path}\n".encode())

          HTTPServer(("0.0.0.0", 3000), Handler).serve_forever()
          EOF
          nohup python3 /srv/echo_server.py &

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc01
      Port: 3000
      Protocol: HTTP
      TargetType: instance
      Targets:
        - Id: !Ref ApiInstance
      HealthCheckPath: /

Outputs:
  Alb01Arn:
    Value: !Ref Alb01
    Export:
      Name: api-alb-arn
  Alb01DomainName:
    Value: !GetAtt Alb01.DNSName
    Export:
      Name: api-alb-domain-name
