AWSTemplateFormatVersion: 2010-09-09
Description: EC2 service

Parameters:
  ApiCertificateArn:
    Type: String
  ImageRepositoryName:
    Type: String
  GitSha:
    Type: String
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  FckNatAmiId:
    Type: String
    Default: ami-037c5d82ae136c25d

Resources:
  Vpc01:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 192.168.0.0/24
      EnableDnsHostnames: true

  RouteTable01:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc01

  RouteInternetGateway:
    Type: AWS::EC2::Route
    DependsOn: Ig01Vpc01
    Properties:
      RouteTableId: !Ref RouteTable01
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway01

  PublicSubnet01:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 192.168.0.0/27
      AvailabilityZone: !Select [0, !GetAZs '']
      VpcId: !Ref Vpc01
      MapPublicIpOnLaunch: true

  Subnet01RouteTable01:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable01
      SubnetId: !Ref PublicSubnet01

  PublicSubnet02:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 192.168.0.32/27
      AvailabilityZone: !Select [1, !GetAZs '']
      VpcId: !Ref Vpc01
      MapPublicIpOnLaunch: true

  Subnet02RouteTable01:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable01
      SubnetId: !Ref PublicSubnet02

  PrivateSubnet01:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 192.168.0.64/27
      AvailabilityZone: !Select [0, !GetAZs '']
      VpcId: !Ref Vpc01

  PrivateSubnet02:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 192.168.0.96/27
      AvailabilityZone: !Select [1, !GetAZs '']
      VpcId: !Ref Vpc01

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc01

  RouteFckNat:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NetworkInterfaceId: !Ref FckNatInterface

  PrivateSubnet01RouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet01

  PrivateSubnet02RouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet02

  InternetGateway01:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: CloudFront Required

  Ig01Vpc01:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway01
      VpcId: !Ref Vpc01

  FckNatInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref PublicSubnet01
      GroupSet:
        - !GetAtt [FckNatSg, GroupId]
      SourceDestCheck: false

  FckNatInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref FckNatRole

  FckNatLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn: FckNatRole
    Properties:
      LaunchTemplateName: FckNatLaunchTemplate
      LaunchTemplateData:
        ImageId: !Ref FckNatAmiId
        InstanceType: t4g.nano
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups:
              - !GetAtt [FckNatSg, GroupId]
        IamInstanceProfile:
          Name: !Ref FckNatInstanceProfile
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo "eni_id=${FckNatInterface}" >> /etc/fck-nat.conf
            service fck-nat restart

  FckNatAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MaxSize: "1"
      MinSize: "1"
      DesiredCapacity: "1"
      LaunchTemplate:
        LaunchTemplateId: !Ref FckNatLaunchTemplate
        Version: !GetAtt FckNatLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
        - !Ref PublicSubnet01
      Tags:
        - Key: Name
          Value: fck-nat
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingScheduledAction:
        IgnoreUnmodifiedGroupSizeProperties: true

  FckNatSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for FckNat
      SecurityGroupIngress:
        - SourceSecurityGroupId: !Ref Sg01
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
        - SourceSecurityGroupId: !Ref Sg02
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: "-1"
      VpcId: !Ref Vpc01
      
  FckNatRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
        Version: "2012-10-17"
      Policies:
        - PolicyName: AttachNatEniPolicy
          PolicyDocument:
            Statement:
              - Action:
                  - ec2:AttachNetworkInterface
                  - ec2:ModifyNetworkInterfaceAttribute
                Effect: Allow
                Resource: "*"
            Version: "2012-10-17"
        - PolicyName: AssociateNatAddressPolicy
          PolicyDocument:
            Statement:
              - Action:
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                Effect: Allow
                Resource: "*"
            Version: "2012-10-17"

  Sg01:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc01
      GroupDescription: ALB SG

  Sg01InboundRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allows traffic from CloudFront
      GroupId: !Ref Sg01
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourcePrefixListId: pl-82a045eb

  Alb01:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      SecurityGroups:
        - !Ref Sg01
      Subnets:
        - !Ref PrivateSubnet01
        - !Ref PrivateSubnet02

  Alb01ListenerApi:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb01
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ApiCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  Sg02:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc01
      GroupDescription: App instance SG

  Sg02InboundRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allows traffic from ALB
      GroupId: !Ref Sg02
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref Sg01

  ApiInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
      RoleName: ApiInstanceRole

  ApiInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ApiInstanceProfile
      Roles:
        - !Ref ApiInstanceRole

  ApiLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: t4g.nano
        IamInstanceProfile:
          Name: !Ref ApiInstanceProfile
        ImageId: !Ref LatestAmiId
        SecurityGroupIds:
          - !Ref Sg02
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            dnf update -y
            dnf install docker -y
            systemctl enable --now docker

            aws ecr get-login-password --region ${AWS::Region} | \
              docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
            
            docker pull ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepositoryName}:api-${GitSha}
            docker run -d --restart unless-stopped -p 3000:3000 \
              ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepositoryName}:api-${GitSha}

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc01
      Port: 3000
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /health

  ApiAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref ApiLaunchTemplate
        Version: !GetAtt ApiLaunchTemplate.LatestVersionNumber
      MaxSize: '1'
      MinSize: '1'
      VPCZoneIdentifier: 
        - !Ref PrivateSubnet01
        - !Ref PrivateSubnet02
      TargetGroupARNs:
        - !Ref ApiTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300

Outputs:
  Alb01Arn:
    Value: !Ref Alb01
    Export:
      Name: api-alb01-arn
  Alb01DomainName:
    Value: !GetAtt Alb01.DNSName
    Export:
      Name: api-alb01-domain-name
  Alb01ListenerApiArn:
    Value: !Ref Alb01ListenerApi
    Export:
      Name: api-alb01-listener-api-arn
  ApiTargetGroupArn:
    Value: !Ref ApiTargetGroup
    Export:
      Name: api-api-target-group-arn
