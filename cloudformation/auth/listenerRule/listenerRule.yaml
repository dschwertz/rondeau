AWSTemplateFormatVersion: 2010-09-09
Description: ALB listener rules are added later during the build after dependency services are already configured (Cognito for protected listener)

Parameters:
  ApiStage:
    Type: String
  DomainName:
    Type: String

Resources:
  ListenerRuleLogout:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions: 
        - Type: redirect
          Order: 1
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            Host: !Sub
                - '${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
                - UserPoolDomain: !ImportValue cognito-user-pool-domain
            Path: /logout
            Query: !Sub
              - 'client_id=${ClientId}&logout_uri=https://${DomainName}'
              - ClientId: !ImportValue cognito-user-pool-client-id
            StatusCode: HTTP_301
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - !Sub '/${ApiStage}/logout'
      ListenerArn: !ImportValue ListenerApiArn
      Priority: 1

  ListenerRuleLogin:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions: 
        - Type: authenticate-cognito
          Order: 1
          AuthenticateCognitoConfig:
            UserPoolArn: !ImportValue cognito-user-pool-arn
            UserPoolClientId: !ImportValue cognito-user-pool-client-id
            UserPoolDomain: !ImportValue cognito-user-pool-domain
            OnUnauthenticatedRequest: authenticate
        - Type: forward
          Order: 2
          TargetGroupArn: !ImportValue TargetGroupApiArn
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - !Sub '/${ApiStage}/login'
      ListenerArn: !ImportValue ListenerApiArn
      Priority: 2

  ListenerRuleProtected:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions: 
        - Type: authenticate-cognito
          Order: 1
          AuthenticateCognitoConfig:
            UserPoolArn: !ImportValue cognito-user-pool-arn
            UserPoolClientId: !ImportValue cognito-user-pool-client-id
            UserPoolDomain: !ImportValue cognito-user-pool-domain
            OnUnauthenticatedRequest: deny
        - Type: forward
          Order: 2
          TargetGroupArn: !ImportValue TargetGroupApiArn
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - !Sub '/${ApiStage}/*'
      ListenerArn: !ImportValue ListenerApiArn
      Priority: 30
