AWSTemplateFormatVersion: 2010-09-09
Description: Cognito service configuration

Parameters:
  DomainName:
    Type: String

Resources:

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      DeletionProtection: ACTIVE
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      Schema:
        - AttributeDataType: String
          DeveloperOnlyAttribute: false
          Mutable: true
          Name: email
          Required: true
          StringAttributeConstraints:
            MaxLength: "99"
            MinLength: "1"
      UsernameAttributes:
        - email
      UserPoolName: !Sub rondeau-userpool-${AWS::AccountId}

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - !Sub 'https://${DomainName}/oauth2/idpresponse'
      ClientName: !Sub rondeau-app-client-${AWS::AccountId}
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: true
      LogoutURLs:
        - !Sub 'https://${DomainName}'
      SupportedIdentityProviders:
        - COGNITO
      UserPoolId: !Ref UserPool

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub rondeau-userpool-domain-${AWS::AccountId}
      ManagedLoginVersion: 2
      UserPoolId: !Ref UserPool

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: cognito-user-pool-id
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: cognito-user-pool-arn
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: cognito-user-pool-client-id
  UserPoolDomain:
    Value: !Ref UserPoolDomain
    Export:
      Name: cognito-user-pool-domain
